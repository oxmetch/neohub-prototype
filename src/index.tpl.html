<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neohub">
<meta name="theme-color" content="#00AB76">
<meta name="format-detection" content="telephone=no">
<title>Neohub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/inter.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="device">
  <div id="stage">
<!--SCREENS-->
  </div>
  <div id="faceid" hidden>
    <div class="faceid-box">
      <svg viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 20V12a6 6 0 0 1 6-6h8M44 6h8a6 6 0 0 1 6 6v8M58 44v8a6 6 0 0 1-6 6h-8M20 58h-8a6 6 0 0 1-6-6v-8"/>
        <g class="face"><path d="M22 24v4M42 24v4M32 24v12h-3M24 44c4 4 12 4 16 0"/></g>
        <path class="check" d="M20 33l8 8 16-17"/>
      </svg>
      <div class="faceid-label">Face ID</div>
    </div>
  </div>
  <div id="toast" hidden></div>
</div>
<div id="install-hint" hidden>
  <b>Установите прототип на iPhone</b>
  <span>Нажмите <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg> «Поделиться» → «На экран „Домой“». После этого приложение работает без интернета.</span>
  <button type="button" id="install-hint-close">Понятно</button>
</div>
<script src="app.js"></script>
</body>
</html>
